        try {
          var t = localStorage.getItem('dgsi-theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- DGSI light theme · 3/3 · buton injectat in body, zero atingeri in .jsx -->
    <script>
      (function () {
        var btn = document.createElement('button');
        btn.id = 'dgsi-theme-toggle';
        btn.type = 'button';
        function paint() {
          var light = document.documentElement.getAttribute('data-theme') === 'light';
          btn.textContent = light ? '\u263D' : '\u2600';
          btn.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
          btn.setAttribute('title', light ? 'Dark mode' : 'Light mode');
        }
        btn.addEventListener('click', function () {
          var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('dgsi-theme', next); } catch (e) {}
          paint();
        });
        paint();
        document.body.appendChild(btn);
      })();
    </script>
  </body>
</html>
